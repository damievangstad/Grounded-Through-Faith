<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account | Grounded Through Faith</title>
    <meta name="description" content="View your account details for Grounded Through Faith." />
    <link rel="canonical" href="https://www.groundedthroughfaith.org/account.html" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;700&display=swap"
          rel="stylesheet" />
    <style>
        :root {
            color-scheme: light;
            --color-morning-sky: #f8f1e2;
            --color-mist: #e8d9b8;
            --color-honey: #c9a03a;
            --color-cerulean: #7a5a2a;
        }

        body {
            font-family: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .section-title {
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-[var(--color-morning-sky)] via-[var(--color-mist)]/40 to-[var(--color-honey)]/30 text-stone-800">
    <main class="min-h-screen px-6 py-16">
        <div class="mx-auto flex max-w-2xl flex-col items-center text-center">
            <a href="index.html" class="text-xs font-semibold uppercase tracking-[0.3em] text-[var(--color-cerulean)]">Grounded Through Faith</a>
            <h1 class="section-title mt-4 text-3xl font-semibold text-stone-900 md:text-4xl">Your account</h1>
            <p class="mt-3 text-sm text-stone-600 md:text-base">Here are the details tied to your current sign-in.</p>
        </div>
        <div class="mx-auto mt-10 max-w-xl rounded-3xl border border-[var(--color-mist)]/70 bg-white/90 p-6 text-center shadow-xl shadow-[var(--color-mist)]/50">
            <p class="text-xs font-semibold uppercase tracking-[0.2em] text-[var(--color-cerulean)]">Signed in as</p>
            <p class="mt-3 text-lg font-semibold text-stone-900" data-auth-email>Account</p>
            <p data-auth-show="signed-out" class="mt-4 hidden text-sm text-stone-600">
                You are not signed in. <a href="signin.html" class="font-semibold text-[var(--color-cerulean)] hover:text-[#8a6426]">Sign in</a>.
            </p>
            <div class="mt-6 flex flex-wrap justify-center gap-3 text-sm font-semibold">
                <a href="member-portal.html" class="inline-flex items-center rounded-full bg-[var(--color-honey)] px-4 py-2 text-stone-900 shadow-lg shadow-[var(--color-honey)]/40 transition hover:-translate-y-0.5 hover:bg-[#b5862d]">Go to portal</a>
                <a href="index.html" class="inline-flex items-center rounded-full border border-[var(--color-honey)]/60 bg-white px-4 py-2 text-[var(--color-cerulean)] transition hover:-translate-y-0.5 hover:border-[var(--color-honey)]">Back home</a>
            </div>
        </div>
    </main>
    <script src="assets/auth-state.js"></script>
</body>
</html>
