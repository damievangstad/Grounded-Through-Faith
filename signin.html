<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="description" content="Sign in to your free Grounded Through Faith account to save Faith Formation AI chats and access resources." />
    <link rel="canonical" href="https://www.groundedthroughfaith.org/signin.html" />
    <meta property="og:title" content="Grounded Through Faith Sign In" />
    <meta property="og:description" content="Access your free Grounded Through Faith account and keep your Faith Formation AI chats saved." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.groundedthroughfaith.org/signin.html" />

    <meta name="twitter:description" content="Sign in to your free Grounded Through Faith account and keep your Faith Formation AI chats saved." />
    <meta name="twitter:image" content="https://www.groundedthroughfaith.org/assets/treelogo.png" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            color-scheme: light;
            --color-morning-sky: #f8f1e2;
            --color-mist: #e8d9b8;
            --color-honey: #c9a03a;
            --color-cerulean: #7a5a2a;
        }
        body { font-family: 'Montserrat', system-ui, sans-serif; }
        .section-title { font-family: 'Playfair Display', Georgia, serif; }
    </style>
</head>
<body class="bg-gradient-to-b from-[var(--color-morning-sky)] via-[var(--color-mist)]/40 to-[var(--color-honey)]/30 text-stone-800">
    <main class="min-h-screen px-6 py-16">
        <div class="mx-auto flex max-w-3xl flex-col items-center text-center">
            <a href="index.html" class="text-xs font-semibold uppercase tracking-[0.3em] text-[var(--color-cerulean)]">Grounded Through Faith</a>
            <h1 class="section-title mt-4 text-3xl font-semibold text-stone-900 md:text-4xl">Sign in to your account</h1>
            <p class="mt-3 max-w-2xl text-sm text-stone-600 md:text-base">
                Access your saved Faith Formation AI chats and keep your resources synced across devices.
            </p>
        </div>
        <div class="mx-auto mt-10 max-w-2xl rounded-3xl border border-[var(--color-mist)]/70 bg-white/90 p-8 shadow-xl shadow-[var(--color-mist)]/50">
            <form id="member-signin" class="space-y-4">
                <div class="text-xs font-semibold uppercase tracking-[0.2em] text-[var(--color-cerulean)]">Sign in</div>
                <h2 class="section-title text-2xl font-semibold text-stone-900" id="signin-heading">Welcome back</h2>
                <p class="text-sm text-stone-600" id="signin-subhead">Use the email and password tied to your account.</p>
                <div class="space-y-2">
                    <label for="member-email" class="text-xs font-semibold uppercase tracking-[0.2em] text-[var(--color-cerulean)]">Email address</label>
                    <input id="member-email" type="email" required class="w-full rounded-2xl border border-stone-200 bg-white px-4 py-3 text-sm text-stone-700 shadow-sm focus:border-[var(--color-cerulean)] focus:outline-none focus:ring-2 focus:ring-[var(--color-cerulean)]/30" placeholder="you@example.com" />
                </div>
                <div class="space-y-2">
                    <label for="member-password" class="text-xs font-semibold uppercase tracking-[0.2em] text-[var(--color-cerulean)]">Password</label>
                    <input id="member-password" type="password" required class="w-full rounded-2xl border border-stone-200 bg-white px-4 py-3 text-sm text-stone-700 shadow-sm focus:border-[var(--color-cerulean)] focus:outline-none focus:ring-2 focus:ring-[var(--color-cerulean)]/30" placeholder="Your saved password" />
                </div>
                <button type="submit" class="inline-flex w-full items-center justify-center rounded-2xl border border-[var(--color-honey)]/70 bg-white px-5 py-3 text-sm font-semibold text-[var(--color-cerulean)] shadow-sm transition hover:-translate-y-0.5 hover:border-[var(--color-honey)]">Sign in</button>
                <p id="signin-status" class="hidden text-sm" aria-live="polite"></p>
            </form>
            <div class="mt-8 border-t border-[var(--color-mist)]/60 pt-8">
                <form id="member-register" class="space-y-4">
                    <div class="text-xs font-semibold uppercase tracking-[0.2em] text-[var(--color-cerulean)]">Create account</div>
                    <h2 class="section-title text-2xl font-semibold text-stone-900">Start here</h2>
                    <div class="space-y-2">
                        <label for="register-email" class="text-xs font-semibold uppercase tracking-[0.2em] text-[var(--color-cerulean)]">Email address</label>
                        <input id="register-email" type="email" required class="w-full rounded-2xl border border-stone-200 bg-white px-4 py-3 text-sm text-stone-700 shadow-sm focus:border-[var(--color-cerulean)] focus:outline-none focus:ring-2 focus:ring-[var(--color-cerulean)]/30" placeholder="you@example.com" />
                    </div>
                    <div class="space-y-2">
                        <label for="register-password" class="text-xs font-semibold uppercase tracking-[0.2em] text-[var(--color-cerulean)]">Password</label>
                        <input id="register-password" type="password" required minlength="8" class="w-full rounded-2xl border border-stone-200 bg-white px-4 py-3 text-sm text-stone-700 shadow-sm focus:border-[var(--color-cerulean)] focus:outline-none focus:ring-2 focus:ring-[var(--color-cerulean)]/30" placeholder="Minimum 8 characters" />
                    </div>
                    <div class="space-y-2">
                        <label for="register-password-confirm" class="text-xs font-semibold uppercase tracking-[0.2em] text-[var(--color-cerulean)]">Confirm password</label>
                        <input id="register-password-confirm" type="password" required minlength="8" class="w-full rounded-2xl border border-stone-200 bg-white px-4 py-3 text-sm text-stone-700 shadow-sm focus:border-[var(--color-cerulean)] focus:outline-none focus:ring-2 focus:ring-[var(--color-cerulean)]/30" placeholder="Re-enter your password" />
                    </div>
                    <button type="submit" class="inline-flex w-full items-center justify-center rounded-2xl bg-[var(--color-honey)] px-5 py-3 text-sm font-semibold text-stone-900 shadow-lg shadow-[var(--color-honey)]/40 transition hover:-translate-y-0.5 hover:bg-[#b5862d]">Create account</button>
                    <p id="register-status" class="hidden text-sm" aria-live="polite"></p>
                </form>
            </div>
            <p class="mt-8 text-center text-xs text-stone-500">Need help? Email <a href="mailto:TheMissionEffect@gmail.com" class="underline-offset-2 hover:underline">TheMissionEffect@gmail.com</a>.</p>
        </div>
    </main>
    <script>
        // Client-side authentication helper for the free account flow:
        // 1) Create an email/password account
        // 2) Sign in to save your chats and access the portal
        (function () {
            // Update the footer year immediately for a polished experience.
            const signinYear = document.getElementById('signin-year');
            if (signinYear) signinYear.textContent = new Date().getFullYear();

            // Capture registration and login inputs for the guided flow.
            const registerForm = document.getElementById('member-register');
            const registerEmail = document.getElementById('register-email');
            const registerPassword = document.getElementById('register-password');
            const registerConfirm = document.getElementById('register-password-confirm');
            const registerFeedback = document.getElementById('register-status');
            const form = document.getElementById('member-signin');
            const emailInput = document.getElementById('member-email');
            const codeInput = document.getElementById('member-password');
            const feedback = document.getElementById('signin-status');
            const heading = document.getElementById('signin-heading');
            const subhead = document.getElementById('signin-subhead');
            const params = new URLSearchParams(window.location.search);
            const redirectTarget = params.get('redirect');
            const codeRequestForm = document.getElementById('code-request');
            const codeRequestEmail = document.getElementById('code-request-email');
            const codeRequestStatus = document.getElementById('code-request-status');

            // Hide password-reset UI fragments left in the markup so the page stays focused on the streamlined login.
            ['recovery-panel', 'password-setup', 'forgot-password-toggle', 'recovery-request', 'recovery-complete'].forEach((id) => {
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });

            // Render a friendly status line with semantic colors for either form.
            function showFeedback(target, text, tone) {
                if (!target) return;
                target.textContent = text;
                target.classList.remove('hidden', 'text-red-600', 'text-green-700', 'text-stone-600');
                if (tone === 'error') {
                    target.classList.add('text-red-600');
                } else if (tone === 'success') {
                    target.classList.add('text-green-700');
                } else {
                    target.classList.add('text-stone-600');
                }
            }

            // Provide human-readable errors instead of raw API messages.
            function friendlyMessage(raw, fallback) {
                const text = (raw || '').toString();
                if (!text) return fallback;
                const normalized = text.toLowerCase();
                const isDbIssue =
                    normalized.includes('database') ||
                    normalized.includes('binding') ||
                    normalized.includes('service unavailable');
                if (isDbIssue) {
                    return 'We could not reach your account right now. Please try again or email support.';
                }
                return text;
            }

            // Persist session flags so nav buttons can reflect sign-in state and subscriber status right away.
            function storeSession(email, subscriber) {
                try {
                    sessionStorage.setItem('gtfMemberSession', 'true');
                    sessionStorage.setItem('gtfMemberEmail', email);
                    sessionStorage.setItem('gtfMemberSubscriber', subscriber ? 'true' : 'false');
                    if (window.gtfAuth && typeof window.gtfAuth.refresh === 'function') {
                        window.gtfAuth.refresh();
                    }
                } catch (error) {
                    /* ignore storage errors */
                }
            }

            // Support registration so visitors can sign in immediately.
            if (registerForm) {
                registerForm.addEventListener('submit', async (event) => {
                    event.preventDefault();
                    const email = (registerEmail?.value || '').trim();
                    const password = (registerPassword?.value || '').trim();
                    const confirm = (registerConfirm?.value || '').trim();

                    if (!email || !password) {
                        showFeedback(registerFeedback, 'Enter an email and password to continue.', 'error');
                        return;
                    }

                    if (password !== confirm) {
                        showFeedback(registerFeedback, 'Passwords must match.', 'error');
                        return;
                    }

                    if (password.length < 8) {
                        showFeedback(registerFeedback, 'Passwords must be at least 8 characters.', 'error');
                        return;
                    }

                    showFeedback(registerFeedback, 'Creating your account...', 'pending');

                    try {
                        const response = await fetch('/api/account', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'register', email, password }),
                        });

                        const data = await response.json();
                        const message = friendlyMessage(data?.message, 'Could not create your account.');

                        if (!response.ok) {
                            showFeedback(registerFeedback, message, 'error');
                            return;
                        }

                        storeSession(email, false);
                        showFeedback(registerFeedback, 'Account created. Taking you to your portal...', 'success');
                        setTimeout(() => {
                            window.location.href = redirectTarget || 'member-portal.html';
                        }, 600);
                    } catch (error) {
                        showFeedback(registerFeedback, 'Could not create your account. Please try again.', 'error');
                    }
                });
            }

            // Submit the login form, honoring existing passwords and redirecting to the portal or requested page.
            if (form) {
                form.addEventListener('submit', async (event) => {
                    event.preventDefault();
                    const email = (emailInput?.value || '').trim();
                    const code = (codeInput?.value || '').trim();

                    if (!email || !code) {
                        showFeedback(feedback, 'Enter your email and password.', 'error');
                        return;
                    }

                    showFeedback(feedback, 'Signing you in...', 'pending');

                    try {
                        const response = await fetch('/api/account', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'login', email, password: code }),
                        });

                        const data = await response.json();
                        const message = friendlyMessage(data?.message, 'Could not sign you in.');

                        if (!response.ok) {
                            showFeedback(feedback, message, 'error');
                            return;
                        }

                        const isSubscriber = data?.subscriber === true;
                        storeSession(email, isSubscriber);

                        if (heading) heading.textContent = 'Signed in';
                        if (subhead) subhead.textContent = 'Taking you to your account portal...';
                        showFeedback(feedback, 'Signed in! Redirecting to your account portal...', 'success');

                        const target = redirectTarget || 'member-portal.html';
                        window.location.href = target;
                    } catch (error) {
                        showFeedback(feedback, 'Could not sign you in. Please try again.', 'error');
                    }
                });
            }
        })();
    </script>
</body>
</html>
