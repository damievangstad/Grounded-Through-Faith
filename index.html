            crossorigin=""></script>
    <style>
        :root {
            color-scheme: light;
            --color-morning-sky: #f8f1e2;
            --color-mist: #e8d9b8;
            --color-honey: #c9a03a;
            --color-cerulean: #7a5a2a;
        }

        body {
            font-family: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .section-title {
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        }

        details > summary {
            list-style: none;
        }

        details > summary::-webkit-details-marker {
            display: none;
        }
    </style>
    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "Grounded Through Faith",
          "url": "https://www.groundedthroughfaith.org/",
          "logo": "https://www.groundedthroughfaith.org/assets/treelogo.png",
          "description": "Grounded Through Faith equips Catholics with study plans, devotionals, and parish resources to deepen their discipleship.",
          "email": "contact@groundedthroughfaith.org"
        }
    </script>
    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "Grounded Through Faith",
          "url": "https://www.groundedthroughfaith.org/",
          "description": "Explore Catholic study plans, a customizable devotional generator, and a parish finder tailored to your faith journey.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.groundedthroughfaith.org/?s={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }

<body class="bg-gradient-to-b from-[var(--color-morning-sky)] via-[var(--color-mist)]/40 to-[var(--color-honey)]/30 text-stone-800">
    <header class="relative overflow-hidden">
        <div class="pointer-events-none absolute inset-0 bg-gradient-to-br from-[var(--color-morning-sky)]/80 via-[var(--color-mist)]/70 to-[var(--color-honey)]/25"
             aria-hidden="true"></div>
        <div class="pointer-events-none absolute -left-20 top-10 h-60 w-60 rounded-full bg-[var(--color-honey)]/20 blur-3xl"
             aria-hidden="true"></div>
        <div class="pointer-events-none absolute -right-24 bottom-0 h-72 w-72 rounded-full bg-[var(--color-honey)]/30 blur-3xl"
             aria-hidden="true"></div>

        <div class="relative z-10 mx-auto flex max-w-6xl justify-end px-6 pt-6">
            <div data-auth-show="signed-in" class="hidden">
                <details class="group relative">
                    <summary class="flex cursor-pointer items-center gap-2 rounded-full bg-[var(--color-morning-sky)]/90 px-4 py-2 text-xs font-semibold text-stone-700 shadow-lg shadow-[var(--color-mist)]/50 ring-1 ring-[var(--color-honey)]/40 transition hover:text-[var(--color-cerulean)]">
                        <span data-auth-email>Account</span>
                        <span class="text-[10px] text-stone-400 transition group-open:text-[var(--color-cerulean)]">v</span>
                    </summary>
                    <div class="absolute right-0 mt-2 hidden w-48 rounded-2xl border border-[var(--color-mist)]/70 bg-white/95 p-2 text-sm shadow-xl group-open:block">
                        <a href="account.html" class="block rounded-xl px-3 py-2 text-stone-700 transition hover:bg-[var(--color-mist)]/40">Account</a>
                        <a href="member-portal.html" class="block rounded-xl px-3 py-2 text-stone-700 transition hover:bg-[var(--color-mist)]/40">Dashboard</a>
                    </div>
                </details>
            </div>
        </div>

        <section class="relative z-10 mx-auto flex max-w-5xl flex-col items-center px-6 pb-24 pt-20 text-center">
            <span class="inline-flex items-center gap-2 rounded-full bg-[var(--color-honey)]/20 px-4 py-1 text-xs font-semibold uppercase tracking-[0.3em] text-[var(--color-cerulean)]">
                Faith Formation AI
            </span>
            <h1 class="section-title mt-6 text-4xl font-semibold text-stone-900 md:text-5xl lg:text-6xl">
                What are you working on?
            </h1>
            <p class="mt-3 max-w-2xl text-base text-stone-600 md:text-lg">
                Share your question or formation goal and receive Scripture, reflection, and next steps.
            </p>
            <form class="mt-10 w-full max-w-3xl">
                <div class="relative flex items-center rounded-full border border-[var(--color-mist)]/70 bg-white px-5 py-3 shadow-xl shadow-[var(--color-mist)]/60">
                    <span class="absolute left-6 text-xl font-semibold text-stone-500">+</span>
                    <input type="text"
                           aria-label="Ask faith formation AI"
                           placeholder="Ask anything"
                           class="w-full bg-transparent py-2 pl-8 pr-24 text-sm text-stone-700 placeholder:text-stone-400 focus:outline-none md:text-base" />
                    <button type="button"
                            class="absolute right-16 inline-flex h-9 w-9 items-center justify-center rounded-full text-stone-500 transition hover:bg-stone-100"
                            aria-label="Use voice">
                        <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5">
                            <path fill="currentColor" d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Zm-5 9a1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.08A7 7 0 0 0 19 12a1 1 0 1 0-2 0 5 5 0 0 1-10 0Z"/>
                        </svg>
                    </button>
                    <button type="submit"
                            class="absolute right-2 inline-flex h-10 w-10 items-center justify-center rounded-full bg-[var(--color-honey)] text-stone-900 shadow-lg shadow-[var(--color-honey)]/40 transition hover:-translate-y-0.5 hover:bg-[#b5862d]"
                            aria-label="Send">
                        <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5">
                            <path fill="currentColor" d="M5 3h2v18H5V3Zm4 4h2v10H9V7Zm4-2h2v14h-2V5Zm4 5h2v4h-2v-4Z"/>
                        </svg>
                    </button>
                </div>
            </form>
            <div class="mt-6 flex flex-wrap justify-center gap-3 text-sm">
                <button type="button"
                        class="rounded-full border border-[var(--color-mist)]/70 bg-white/80 px-4 py-2 font-medium text-stone-700 shadow-sm transition hover:-translate-y-0.5 hover:border-[var(--color-honey)]">
                    Create a 7-day devotional
                </button>
                <button type="button"
                        class="rounded-full border border-[var(--color-mist)]/70 bg-white/80 px-4 py-2 font-medium text-stone-700 shadow-sm transition hover:-translate-y-0.5 hover:border-[var(--color-honey)]">
                    Help me study Scripture
                </button>
                <button type="button"
                        class="rounded-full border border-[var(--color-mist)]/70 bg-white/80 px-4 py-2 font-medium text-stone-700 shadow-sm transition hover:-translate-y-0.5 hover:border-[var(--color-honey)]">
                    I'm wrestling with a question
                </button>
            </div>
        </section>
    </header>
</body>
</html>
